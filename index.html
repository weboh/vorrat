<!DOCTYPE html>
<html lang="de">
<head>

<meta name="mobile-web-app-capable" content="yes">

<script>try{var dz=localStorage.getItem('vorrat-design');if(dz)document.documentElement.setAttribute('data-design',dz)}catch(e){}</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap">
<style>
:root{--bg:#EAF2EA;--bgi:linear-gradient(160deg,#F5FAF4 0%,#E0ECE1 100%);--bgs:auto;--sf:#fff;--ink:#14261C;--mut:#5A6E60;--ln:#D0DDD1;--ac:#2E7D5B;--acd:#fff;--nf:#3B5BDB;--warn:#C2410C;--wbg:#FDE8DC;--ok:#2E9E63;--mid:#BC8800;--lo:#E0701E;--bad:#C62828;--e1b:#FBDADA;--e1t:#8E1B1B;--e2b:#FDE3CF;--e2t:#8A3A06;--e3b:#FBF0C4;--e3t:#6B4F00;--sh:0 1px 2px rgba(20,40,30,.07),0 6px 16px rgba(20,40,30,.07);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-design="fliesen"]{--bg:#E9F0F3;--bgi:linear-gradient(rgba(60,100,130,.10) 1px,transparent 1px),linear-gradient(90deg,rgba(60,100,130,.10) 1px,transparent 1px);--bgs:46px 46px;--sf:#fff;--ink:#12252F;--mut:#586E7A;--ln:#CFDBE2;--ac:#2A7191;--acd:#fff}
:root[data-design="leinen"]{--bg:#F5EEE2;--bgi:repeating-linear-gradient(0deg,rgba(120,90,50,.045) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,rgba(120,90,50,.035) 0 1px,transparent 1px 4px);--bgs:auto;--sf:#FFFCF6;--ink:#2A2017;--mut:#6D5D4D;--ln:#E1D4BF;--ac:#B04F29;--acd:#fff}
:root[data-design="morgen"]{--bg:#EAF6F0;--bgi:linear-gradient(150deg,#E2F6EE 0%,#FDEBDD 100%);--bgs:auto;--sf:#fff;--ink:#17262A;--mut:#5C7075;--ln:#D9E5E0;--ac:#1F8573;--acd:#fff}
.cat{display:inline-block;--h:200;background:hsl(var(--h) 55% 90%);color:hsl(var(--h) 60% 22%);border-radius:6px;padding:0 7px;font-weight:600;font-size:12px}
@media (prefers-color-scheme:dark){
.cat{background:hsl(var(--h) 32% 24%);color:hsl(var(--h) 65% 82%)}
:root{--bg:#0E1913;--bgi:linear-gradient(160deg,#12201A 0%,#0B140F 100%);--sf:#16271F;--ink:#E3EEE6;--mut:#8DA698;--ln:#27402F;--ac:#5BC49A;--acd:#08201B;--nf:#8AA2FF;--warn:#FF9C6B;--wbg:#3A2418;--ok:#5BC49A;--mid:#F2C94C;--lo:#FF9C6B;--bad:#FF7A7A;--e1b:#4A1E1E;--e1t:#FFB3B3;--e2b:#47260F;--e2t:#FFC299;--e3b:#40370F;--e3t:#F2DA7A;--sh:0 1px 2px rgba(0,0,0,.45),0 6px 16px rgba(0,0,0,.35)}
:root[data-design="fliesen"]{--bg:#0E1920;--bgi:linear-gradient(rgba(150,190,220,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(150,190,220,.07) 1px,transparent 1px);--bgs:46px 46px;--sf:#15262F;--ink:#E2EDF2;--mut:#8CA4B0;--ln:#274150;--ac:#6BB7D6;--acd:#08202B}
:root[data-design="leinen"]{--bg:#1B1611;--bgi:repeating-linear-gradient(0deg,rgba(255,220,170,.03) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,rgba(255,220,170,.025) 0 1px,transparent 1px 4px);--bgs:auto;--sf:#251E17;--ink:#F0E6D6;--mut:#A99A88;--ln:#3A2F24;--ac:#E48C5F;--acd:#2A1409}
:root[data-design="morgen"]{--bg:#0E1D1B;--bgi:linear-gradient(150deg,#0E211D 0%,#2A1F1A 100%);--bgs:auto;--sf:#16282A;--ink:#E4EEEC;--mut:#8DA6A4;--ln:#2A4240;--ac:#4FCBB5;--acd:#06241E}
}
:root[data-design="kreide"]{color-scheme:dark;--bg:#1D2A25;--bgi:radial-gradient(ellipse at 20% 10%,rgba(255,255,255,.06),transparent 55%),radial-gradient(ellipse at 80% 90%,rgba(255,255,255,.05),transparent 50%);--bgs:auto;--sf:#26362F;--ink:#F2F1E7;--mut:#AAB8AE;--ln:#3B4E45;--ac:#F2C94C;--acd:#1D2A25;--nf:#8AA2FF;--warn:#FF9C6B;--wbg:#3A2418;--ok:#5BC49A;--mid:#F2C94C;--lo:#FF9C6B;--bad:#FF7A7A;--e1b:#4A1E1E;--e1t:#FFB3B3;--e2b:#47260F;--e2t:#FFC299;--e3b:#40370F;--e3t:#F2DA7A;--sh:0 1px 2px rgba(0,0,0,.45),0 6px 16px rgba(0,0,0,.35)}
:root[data-design="kreide"] .cat{background:hsl(var(--h) 32% 24%);color:hsl(var(--h) 65% 82%)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background-color:var(--bg);background-image:var(--bgi);background-size:var(--bgs);background-attachment:fixed;min-height:100vh;color:var(--ink);font:16px/1.4 Figtree,system-ui,sans-serif;padding-bottom:90px}
main{max-width:640px;margin:0 auto;padding:0 14px}
h1{font-size:22px;font-weight:800;margin:0;letter-spacing:-.02em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{color:var(--mut);font-size:14px;margin:10px 0 6px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;background:var(--bg);background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.hd.sc{box-shadow:0 1px 0 var(--ln),0 6px 14px rgba(0,0,0,.06)}
.hdi{position:relative;max-width:640px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:8px}
.ib{width:40px;height:40px;border-radius:50%;border:1px solid var(--ln);background:var(--sf);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;flex:none;font-size:16px}
#bm{position:relative}
#bm[data-n]::after{content:attr(data-n);position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--ac);color:var(--acd);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
.ftb{max-width:640px;margin:0 auto;padding:0 14px 10px;display:none;gap:6px;align-items:center}
.ftb .sel{position:relative;flex:1;min-width:0;color:var(--mut)}
.ftb .sel::after{content:"";position:absolute;right:9px;top:50%;width:6px;height:6px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:translateY(-70%) rotate(45deg);pointer-events:none}
.ftb select{width:100%;-webkit-appearance:none;appearance:none;padding:6px 21px 6px 9px;border:1px solid var(--ln);border-radius:10px;background:var(--sf);color:var(--ink);font:16px Figtree,system-ui,sans-serif;text-overflow:ellipsis;white-space:nowrap;overflow:hidden}
.ftb .sel.act{color:var(--acd)}
.ftb .sel.act select{background:var(--ac);border-color:var(--ac);color:var(--acd);font-weight:700}
.ftb .rs{width:36px;height:36px;font-size:15px}
.sbw{display:none;flex:1;align-items:center;gap:8px;min-width:0}.sbw.on{display:flex}.sbw input{flex:1;min-width:0}
.hdi.so h1,.hdi.so #bs,.hdi.so #bv{display:none}
.menu{display:none;position:absolute;right:14px;top:100%;margin-top:2px;min-width:230px;background:var(--sf);border:1px solid var(--ln);border-radius:14px;box-shadow:var(--sh);padding:6px;z-index:40}
.menu.on{display:block}
.menu button{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:var(--ink);font:600 15px Figtree,system-ui,sans-serif;padding:11px 12px;border-radius:9px;cursor:pointer}
.menu button.on{background:var(--ac);color:var(--acd)}
.menu button.on .bdg{background:var(--acd);color:var(--ac)}
.tabs{display:flex;gap:6px;margin:10px 0}
.tabs{overflow-x:auto}.tabs button{white-space:nowrap}
.tabs button,.chip{border:1px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:99px;padding:8px 13px;font:600 14px Figtree,system-ui,sans-serif;cursor:pointer}
.tabs button.on,.chip.on{background:var(--ac);color:var(--acd);border-color:var(--ac)}
.bdg{display:inline-block;min-width:20px;padding:1px 6px;margin-left:6px;border-radius:99px;background:var(--ac);color:var(--acd);font-size:12px;font-weight:800;line-height:1.3}
.tabs button.on .bdg{background:var(--acd);color:var(--ac)}
textarea{resize:vertical}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--ln);border-radius:10px;background:var(--sf);color:var(--ink);font:16px Figtree,system-ui,sans-serif}
label{display:block;font-size:13px;font-weight:600;color:var(--mut);margin:12px 0 4px}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:1px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:10px;padding:8px 4px;font:700 15px Figtree,system-ui,sans-serif;line-height:1.25;cursor:pointer}
.seg button small{display:block;font-weight:400;font-size:12px;color:var(--mut)}
.seg button.on{color:#17140F;border-color:transparent}
.seg button.on small{color:inherit;opacity:.8}
.seg button.on[data-v="25"]{background:var(--lo)}
.seg button.on[data-v="50"]{background:var(--mid)}
.seg button.on[data-v="100"]{background:var(--ok)}
.item.shop{border-left-color:var(--mut)}.item.done b{text-decoration:line-through;color:var(--mut)}.item.done{opacity:.7}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--ln);background:var(--sf);color:var(--acd);font-weight:800;cursor:pointer;flex:none;padding:0}
.item.done .chk{background:var(--ac);border-color:var(--ac)}
.rm{background:none;border:0;color:var(--mut);font-size:18px;cursor:pointer;padding:6px}
.ph{width:84px;height:84px;border-radius:14px;border:1px dashed var(--ln);display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:13px;background:var(--sf)}
.dzg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.dz{border:2px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:12px;padding:8px;cursor:pointer;font:600 14px Figtree,system-ui,sans-serif;text-align:left;display:flex;align-items:center;gap:10px}
.dz.on{border-color:var(--ac)}
.dz i{width:38px;height:38px;border-radius:10px;flex:none;border:1px solid rgba(0,0,0,.15);position:relative}
.dz i::after{content:"";position:absolute;right:5px;bottom:5px;width:11px;height:11px;border-radius:50%;background:var(--dot)}
.fm label{margin:9px 0 3px;font-size:12px}
.fm input,.fm select,.fm textarea{padding:7px 10px;border-radius:9px}
.fm .btn{padding:8px 12px;font-size:14px;border-radius:10px}
.fm .fhead{display:flex;gap:12px;align-items:center}
.fm .fbtn{flex:1;display:flex;flex-direction:column;gap:6px}
.fm .seg button{padding:5px 4px;font-size:14px}.fm .seg button small{font-size:11px}
.fm .meta{font-size:11px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0}.chips .chip{white-space:nowrap;padding:6px 12px}
.item{background:var(--sf);border:1px solid var(--ln);border-left:5px solid var(--ac);border-radius:12px;padding:6px 10px;margin:6px 0;display:flex;align-items:center;gap:10px;box-shadow:var(--sh)}
.item.nf{border-left-color:var(--nf)}
.item .t{flex:1;min-width:0;cursor:pointer}.item b{display:block;overflow-wrap:anywhere;font-weight:700;font-size:15px}
.item.shop b{overflow-wrap:break-word;word-break:normal}
.item:not(.shop) b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;overflow-wrap:normal}
.t .cat{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:top}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.tile{background:var(--sf);border:1px solid var(--ln);border-top:4px solid var(--ac);border-radius:12px;padding:7px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:var(--sh);min-width:0}
.tile.nf{border-top-color:var(--nf)}
.tile .pw{width:100%}
.tg{width:100%;aspect-ratio:1/1;object-fit:contain;border-radius:10px;background:#fff;border:1px solid var(--ln)}
.tile .th{width:100%;height:auto;aspect-ratio:1/1;font-size:32px;border-radius:10px}
.tn{font-weight:700;font-size:13px;line-height:1.2;text-align:center;width:100%;min-height:2.4em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere;cursor:pointer}
.tile .qty{gap:3px}.tile .qty span{min-width:20px}
.pw{position:relative;display:flex;cursor:pointer}
.dot{position:absolute;top:-3px;right:-3px;width:12px;height:12px;border-radius:50%;border:2px solid var(--sf)}
.dot.r{background:var(--bad)}.dot.o{background:var(--lo)}.dot.y{background:var(--mid)}
.rc{display:flex;flex-direction:column;align-items:center}
.lv{display:flex;gap:3px;margin-top:7px}.lv i{width:16px;height:6px;border-radius:3px;background:var(--ln)}
.lv.hi i.f{background:var(--ok)}.lv.mid i.f{background:var(--mid)}.lv.lo i.f{background:var(--lo)}
.th{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;padding:0;flex:none}
.meta{font-size:13px;color:var(--mut)}
.exp{display:inline-block;border-radius:6px;padding:0 6px;margin-left:6px;font-weight:700;font-size:12px}
.exp.e1{background:var(--e1b);color:var(--e1t)}.exp.e2{background:var(--e2b);color:var(--e2t)}.exp.e3{background:var(--e3b);color:var(--e3t)}
.qty{display:flex;align-items:center;gap:6px}.qty button{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--ln);background:var(--sf);color:var(--ink);font-size:18px;line-height:1;padding:0;cursor:pointer}
.qty button[data-p],.qty button[data-sp]{background:var(--ac);border-color:var(--ac);color:var(--acd)}
.qty span{min-width:24px;text-align:center;font-weight:800}
.btn{border:0;border-radius:12px;padding:12px 16px;font:700 16px Figtree,system-ui,sans-serif;background:var(--ac);color:var(--acd);cursor:pointer}
.btn.s{background:var(--sf);color:var(--ink);border:1px solid var(--ln)}.btn.d{background:transparent;color:var(--bad);border:1.5px solid var(--bad)}
.fab{position:fixed;left:0;right:0;bottom:0;padding:7px 14px calc(7px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--ln);display:flex;gap:8px;max-width:640px;margin:0 auto}
.fab .btn{flex:1;padding:8px 10px;font-size:14px;border-radius:10px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:50}
.sheet.open{display:flex}
.card{background:var(--bg);width:100%;max-width:640px;max-height:calc(100% - env(safe-area-inset-top,0px) - 56px);overflow:auto;overscroll-behavior:contain;border-radius:18px 18px 0 0;padding:12px 14px calc(14px + env(safe-area-inset-bottom,0px))}
video{width:100%;border-radius:12px;background:#000;max-height:40vh}
.thumb{width:44px;height:44px;object-fit:contain;border-radius:10px;background:#fff;border:1px solid var(--ln);flex:none}
.empty{text-align:center;color:var(--mut);padding:36px 10px}
.li{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--ln)}
.li button{background:none;border:0;color:var(--bad);font-weight:600;cursor:pointer}
.msg{font-size:14px;color:var(--warn);margin:6px 0}
</style>
</head>
<body>
<header class="hd" id="hd"><div class="hdi" id="hdi">
<h1 id="ht">Vorrat</h1>
<div class="sbw" id="sbw"><input id="q" type="search" placeholder="Name, Barcode, Anmerkung …" autocomplete="off"><button class="ib" id="sx2" aria-label="Suche schließen">✕</button></div>
<button class="ib" id="bs" aria-label="Suche"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
<button class="ib" id="bv" aria-label="Kachelansicht"></button>
<button class="ib" id="bm" aria-label="Menü"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
<div class="menu" id="mn"></div>
</div><div class="ftb" id="ftb"></div></header>
<main>
<p class="sub"><span id="sum"></span> <span id="hs"></span></p>
<div id="view"></div>
</main>
<div class="fab"><button class="btn s" id="bScan">Scannen</button><button class="btn" id="bAdd">Manuell hinzufügen</button></div>
<div class="sheet" id="sheet"><div class="card" id="card"></div></div>

<script>
var zx=null,KEY='vorrat-v1',S,flt={type:'',loc:'',cat:'',q:'',st:''},tab='bestand',stream=null,scanTimer=null;
function def(){return{locs:['Kühlschrank','Gefrierfach','Vorratsschrank','Keller','Badezimmer','Putzschrank'],
cats:[['Milchprodukte','f'],['Obst & Gemüse','f'],['Fleisch & Fisch','f'],['Getränke','f'],['Konserven','f'],['Backen & Grundzutaten','f'],['Putzmittel','n'],['Drogerie','n'],['Hygiene','n']].map(function(c){return{n:c[0],t:c[1]}}),
items:[],codes:{}}}
function load(){try{var r=localStorage.getItem(KEY);S=r?JSON.parse(r):def()}catch(e){S=def()}S.shop=S.shop||[];S.codes=S.codes||{}}
function lsSave(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert('Speicher voll – die letzte Änderung konnte nicht gespeichert werden. Exportiere eine Sicherung und entferne einige eigene Fotos.')}}
function save(){S.ts=Date.now();lsSave();schedulePush()}
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function catT(n){var c=S.cats.filter(function(x){return x.n===n})[0];return c?c.t:'f'}
function days(d){if(!d)return null;return Math.round((new Date(d+'T00:00:00')-new Date(new Date().toDateString()))/864e5)}

function render(){
 var n=S.items.length,f=S.items.filter(function(i){return catT(i.cat)==='f'}).length;
 $('sum').textContent=n+' Artikel · '+f+' Lebensmittel · '+(n-f)+' Non-Food';
 var T=[['bestand','Bestand'],['shop','Einkaufsliste'],['ordnung','Orte & Kategorien'],['tools','Einstellungen']];
 $('ht').textContent=({bestand:'Vorrat',shop:'Einkaufsliste',ordnung:'Orte & Kategorien',tools:'Einstellungen'})[tab];
 $('mn').innerHTML=T.map(function(t){return '<button data-t="'+t[0]+'" class="'+(tab===t[0]?'on':'')+'"><span>'+t[1]+'</span>'+(t[0]==='shop'&&S.shop.length?'<span class="bdg">'+S.shop.length+'</span>':'')+'</button>'}).join('');
 $('mn').querySelectorAll('button').forEach(function(b){b.onclick=function(){go(b.dataset.t)}});
 if(S.shop.length)$('bm').setAttribute('data-n',S.shop.length);else $('bm').removeAttribute('data-n');
 $('bs').style.display=tab==='bestand'?'':'none';
 $('bv').style.display=tab==='bestand'?'':'none';$('bv').innerHTML=VM==='list'?IC_GRID:IC_LIST;$('bv').setAttribute('aria-label',VM==='list'?'Kachelansicht':'Listenansicht');$('bv').title=VM==='list'?'Kachelansicht':'Listenansicht';
 document.querySelector('.fab').style.display=tab==='bestand'?'flex':'none';
 renderFilters();
 tab==='bestand'?renderList():tab==='shop'?renderShop():tab==='tools'?renderTools():renderManage();
}
function chipRow(key,opts){return '<div class="chips">'+opts.map(function(o){return '<button class="chip '+(flt[key]===o[0]?'on':'')+'" data-k="'+key+'" data-v="'+esc(o[0])+'">'+esc(o[1])+'</button>'}).join('')+'</div>'}
function renderList(){
 var v='';

 remoteUpd=r?r.upd:null;return push(n+1)}).catch(fail)}
function pull(){
 var sh=$('sheet');if(!SES||(sh&&sh.classList.contains('open')))return Promise.resolve();
 setSync('☁ Synchronisiere …');
 return remoteGet().then(function(r){
  if(!r){remoteUpd=null;return push()}
  remoteUpd=r.upd;var rd=r.data,rts=rd.ts||0,lts=S.ts||0;
  if(!isLinked()&&S.items.length&&rd.items&&rd.items.length){
   if(confirm('Auf dem Server liegt schon ein Bestand ('+rd.items.length+' Artikel), auf diesem Gerät sind '+S.items.length+' Artikel.\n\nOK = Server-Stand übernehmen (lokaler Stand wird ersetzt)\nAbbrechen = lokalen Stand hochladen (Server-Stand wird ersetzt)')){adopt(rd);setLinked(true);setSync('☁ Synchronisiert '+stamp());return}
   S.ts=Date.now();lsSave();return push()}
  if(rts>lts){adopt(rd);setLinked(true);setSync('☁ Synchronisiert '+stamp());return}
  if(lts>rts)return push();
  setLinked(true);setSync('☁ Synchronisiert '+stamp())
 }).catch(fail)}
var enriching=false,NETFAIL=false;
function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
function enrich(){
 if(enriching)return Promise.resolve();
 var now=Date.now(),week=6048e5;
 var ids=S.items.filter(function(i){return /^\d{6,}$/.test(i.code||'')&&((!i.img&&!i.noimg)||!i.all||!i.weight)&&(!i.chk2||now-i.chk2>week)}).map(function(i){return i.id});
 if(!ids.length)return Promise.resolve();
 enriching=true;var k=0,done=0,changed=0,bad=0,streak=0;
 function stats(){return{total:ids.length,done:done,changed:changed,bad:bad}}
 function finish(){enriching=false;if(done){save();render()}
  setSync(streak>=3?'Produktdaten: Datenbank nicht erreichbar, später erneut versuchen':bad?'Produktdaten: '+bad+' nicht abrufbar, nächster Versuch beim nächsten Öffnen':changed?'Produktdaten ergänzt: '+changed:(SES?'☁ Synchronisiert '+stamp():''));
  return stats()}
 function step(){
  if(k>=ids.length||streak>=3)return finish();
  var id=ids[k++],it=find(id);if(!it)return step();
  setSync('Produktdaten '+k+'/'+ids.length);
  return lookup(it.code).then(function(r){
   if(!r&&NETFAIL)return sleep(4000).then(function(){return lookup(it.code)});
   return r}).then(function(r){
   if(!r&&NETFAIL){bad++;streak++;return step()}
   streak=0;
   var cur=find(id);
   if(cur){
    if(r){if(!cur.img&&!cur.noimg&&r.img){cur.img=r.img;changed++}if(!cur.all&&r.all){cur.all=r.all;changed++}if(!cur.weight&&r.wt){cur.weight=r.wt;changed++}if(!cur.tr&&r.tr)cur.tr=r.tr}
    cur.chk2=Date.now();done++}
   if(done&&done%10===0){save();render()}
   return step()})}
 return step()}
function boot(){return(SES?pull():Promise.resolve()).then(enrich)}
document.addEventListener('visibilitychange',function(){if(!document.hidden&&!pushing)boot()});
function openSearch(){$('sbw').classList.add('on');$('hdi').classList.add('so');$('q').focus()}
function closeSearch(){$('sbw').classList.remove('on');$('hdi').classList.remove('so');$('q').value='';if(flt.q){flt.q='';if(tab==='bestand')renderList()}}
function renderFilters(){
 var f=$('ftb');f.style.display=tab==='bestand'?'flex':'none';if(tab!=='bestand')return;
 var o=function(arr,cur){return arr.map(function(x){return '<option value="'+esc(x[0])+'"'+(x[0]===cur?' selected':'')+'>'+esc(x[1])+'</option>'}).join('')};
 var sl=function(key,lbl,arr){var cur=flt[key]||'';return '<div class="sel'+(cur?' act':'')+'"><select data-f="'+key+'" aria-label="'+lbl+'">'+o(arr,cur)+'</select></div>'};
 var any=flt.st||flt.type||flt.loc||flt.cat;
 f.innerHTML=sl('st','Status',[['','Status'],['exp','Bald ablaufend ('+S.items.filter(soon).length+')'],['low','Niedrig ('+S.items.filter(low).length+')']])
  +sl('type','Typ',[['','Typ'],['f','Lebensmittel'],['n','Non-Food']])
  +sl('loc','Ort',[['','Ort']].concat(S.locs.map(function(l){return[l,l]})))
  +sl('cat','Kategorie',[['','Kategorie']].concat(S.cats.filter(function(c){return !flt.type||c.t===flt.type}).map(function(c){return[c.n,c.n]})))
  +(any?'<button class="ib rs" id="frs" aria-label="Filter zurücksetzen">✕</button>':'')}
function go(t){$('mn').classList.remove('on');if(t!=='bestand')closeSearch();tab=t;if(window.scrollTo)window.scrollTo(0,0);render()}
$('ftb').onchange=function(e){var t=e.target;if(!t||!t.dataset||!t.dataset.f)return;flt[t.dataset.f]=t.value;if(t.dataset.f==='type')flt.cat='';renderFilters();renderList()};
$('ftb').onclick=function(e){if(e.target&&e.target.id==='frs'){flt.st=flt.type=flt.loc=flt.cat='';renderFilters();renderList()}};
$('bv').onclick=function(){setView(VM==='list'?'grid':'list')};
$('bs').onclick=openSearch;$('sx2').onclick=closeSearch;
$('q').oninput=function(){flt.q=this.value;if(tab==='bestand')renderList()};
$('q').onkeydown=function(e){if(e.key==='Enter')this.blur()};
$('bm').onclick=function(e){e.stopPropagation();$('mn').classList.toggle('on')};
document.addEventListener('click',function(e){var m=$('mn');if(m.classList.contains('on')&&!m.contains(e.target))m.classList.remove('on')});
if(window.addEventListener)window.addEventListener('scroll',function(){$('hd').classList.toggle('sc',window.scrollY>4)},{passive:true});
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
load();render();if(!SES)setSync('☁ nicht angemeldet');boot();
</script>
